services:
  fewclues:
    build: .
    image: fewclues:latest
    container_name: fewclues
    restart: unless-stopped
    # Bound to localhost only: Cloudflare Tunnel (cloudflared on this host) is
    # the only way in, so the CF-Connecting-IP header can be trusted.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SITE_URL: https://fewclues.app
      LAUNCH_DATE: "2026-11-19"
      EDITION: ww
      TZ: Europe/Dublin
      # Beta: the rounds are still marked draft until they've been reviewed.
      # Remove this once every round is "approved".
      ALLOW_DRAFTS: "1"
      # Local testing only — never in production:
      # DEV_DATE: "2026-11-19"
    volumes:
      - fewclues-data:/data
      # Edit questions without rebuilding; the server re-reads the file on change.
      - ./content:/app/content:ro
    mem_limit: 192m
    read_only: true
    tmpfs:
      - /tmp

volumes:
  fewclues-data:
